name: UAT code gates

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: uat-code-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './platform[dev]' opencv-python-headless numpy reportlab 'psycopg[binary]'
      - name: Platform tests
        run: python -m pytest platform/tests -q
      - name: Canonical contract tests
        run: python -m pytest test/test_telemetry_file_reader.py test/test_video_reader_frame_stride.py test/test_uat_proxy_security.py -q
      - name: Static quality
        run: ruff check platform/app platform/tests nodes services main_optimized.py
      - name: ADR-019 contract audit
        run: python scripts/audit_adr019_retirement.py --scope local --strict
      - name: Diff whitespace check
        run: git diff --check

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit and accessibility tests
        run: npm test
      - name: Production build and bundle budget
        run: npm run build
