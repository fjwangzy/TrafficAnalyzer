# --------------------------------------------- HYDRA -----------------------------------------------------
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: custom

hydra:
  output_subdir: null
  run:
    dir: .

# ----------------------------------------------- PIPELINE -------------------------------------------------

pipeline:
  save_video: False  # 保存处理后的最终视频
  show_in_web: True  # 在Web界面（Flask）中显示视频流处理结果，而不是使用cv2.imshow
  send_info_kafka: True  # 是否将信息发送到Kafka

#--------------------------------------------------GENERAL--------------------------------------------------

general:
  colors_of_roads: # BGR 格式的颜色
    1: [102,204,255] #ffcc66
    2: [0,0,170] #aa0000
    3: [17,70,10] #0a3e11
    4: [120,56,126] #7e3878
    5: [30,105,215] #d2691e
  buffer_analytics: 0.5  # 计算车辆数量所基于的时间窗口（分钟）（滑动计算窗口）
  min_time_life_track: 3 # 轨迹被纳入统计所需的最小存活时间（秒）
  count_cars_buffer_frames: 25 # 用于计算当前帧中车辆数量的平滑窗口大小（帧数）

# ------------------------------------------------- NODES --------------------------------------------------

video_reader:
  src: ${oc.env:VIDEO_SRC} # 待处理文件的路径，或摄像头编号（int），或 m3u8 / rtsp 流链接
  skip_secs: 0  # 每隔 <skip_secs> 秒读取一帧
  roads_info: ${oc.env:ROADS_JSON} # 包含视频中道路坐标的 json 文件

detection_node:
  # weight_pth: weights/yolov8m.pt  # 模型 .pt 或 .engine (TensorRT) 文件的路径
  weight_pth: weights/uav_best.pt  # 模型 .pt 或 .engine (TensorRT) 文件的路径
  classes_to_detect: [2,3,4,5,6,7,8,9]  # uav_best.pt 的全部交通工具类别 (排除行人和人)
  confidence: 0.10  # 检测器置信度阈值（值越大，检测到的目标越少）
  iou: 0.7  # NMS 阈值（值越大，匹配到的目标越多）
  imgsz: 640  # 推理时的图像缩放尺寸（默认为 640）

tracking_node:
  # 使用 ByteTrack (https://github.com/ifzhang/ByteTrack)
  first_track_thresh: 0.5  # 初始化新轨迹的阈值
  second_track_thresh: 0.10  # 维持现有轨迹的阈值
  match_thresh: 0.95  # 值越大，相邻帧中检测框的最大允许距离（用于维持轨迹）越大
  track_buffer: 125  # 目标消失后轨迹保持存活的时间（以帧数为单位）

show_node:
  scale: 0.6  # 当 imshow=True 时，结果窗口的缩放比例
  imshow: False  # 处理过程中是否需要显示视频窗口
  fps_counter_N_frames_stat: 15  # FPS 计数器的平均窗口大小（帧数）
  draw_fps_info: True  # 是否显示处理 FPS
  show_roi: True  # 是否显示相邻道路的区域
  overlay_transparent_mask: False # 当 show_roi=True 时是否填充区域（慢速操作）
  show_only_yolo_detections: False  # 是否仅显示检测结果，而不显示跟踪和其他逻辑处理结果
  show_track_id_different_colors: False  # 是否根据轨迹ID显示框颜色，而非根据对象来源逻辑
  show_info_statistics: False  # 是否在画面右侧单独窗口中输出统计信息

video_saver_node:
  fps: 24  # 增加此值可以加速最终输出视频
  out_folder: test_videos/videos_out  # 结果输出文件夹

kafka_producer_node: #// 摄像头 id
  bootstrap_servers: kafka:29092 #127.0.0.1:9092 #kafka:29092
  topic_name: ${oc.env:TOPIC_NAME}
  how_often_sec: 1 # 每隔多少秒发送一次结果
  camera_id: ${oc.decode:${oc.env:CAMERA_ID}}

# ------------------------------------------------- TRAFFIC SITUATION AWARENESS --------------------------------------------------

motion_compensation:
  enabled: true              # 启用无人机运动补偿（需遥测数据）
  hover_threshold_ms: 1.0    # 低于此速度(m/s)视为悬停，跳过速度补偿
  world_anchor: null         # null=自动取首帧GPS均值，或手动 [lat, lon]

calibration:
  mode: "auto"             # "auto" | "telemetry" | "reference_points"
  # 相机内参（一次性配置，从无人机型号获取）
  camera_intrinsics:
    focal_length_mm: 4.5      # 镜头焦距(mm)
    sensor_width_mm: 6.4      # 传感器宽度(mm)，1/2"传感器
    sensor_height_mm: 3.6     # 传感器高度(mm)
  # 回退：固定摄像头无遥测时使用传统标定点
  reference_points: []    # [[px, py, world_x_m, world_y_m], ...]

telemetry:
  enabled: false
  mqtt_broker: "mqtt://mqtt:1883"
  mqtt_topic: "drone/+/osd"
  buffer_size: 100           # 遥测缓冲区大小（条）
  sync_tolerance_sec: 0.05   # 帧↔遥测时间戳同步容忍窗口(秒)

speed_estimation:
  enabled: true
  history_frames: 15      # 速度计算所基于的历史帧数
  smoothing_window: 5      # EMA平滑窗口
  min_displacement_px: 2.0 # 最小位移阈值(像素)

direction_flow:
  enabled: true
  min_track_duration_sec: 2.0    # 轨迹最短存活时间（方向分类需要足够长的轨迹）
  min_position_points: 8         # 轨迹最少位置点
  heading_window: 5              # 计算heading的帧窗口
  queue_speed_threshold_kmh: 5.0 # 低于此速度视为排队
  max_drone_speed_for_world_heading_ms: 5.0  # 无人机超过此速度(m/s)时回退到像素空间heading
  turn_thresholds:
    straight: 25                 # |delta| <= 25度 → 直行
    turn: 120                    # |delta| >= 120度 → 掉头

lane_analysis:
  # 无开关：有车道多边形标注数据且点位命中时自动输出车道级指标
  queue_speed_threshold_kmh: 5.0 # 低于此速度视为排队
  queue_gap_threshold_m: 8.0     # 队列间隙阈值(米)

trajectory:
  enabled: true
  min_track_duration_sec: 2.0     # 轨迹最短存活时间
  turn_angle_thresholds:
    straight: 30
    left_turn: [30, 150]
    right_turn: [-150, -30]
    u_turn: [150, 180]

conflict_detection:
  enabled: false  # 需要模型微调加入person/bicycle后启用
  proximity_threshold_m: 3.0
  ttc_threshold_sec: 2.0
  severity_levels:
    critical: {ttc: 1.0, distance_m: 1.5}
    warning: {ttc: 2.0, distance_m: 3.0}
    info: {ttc: 3.0, distance_m: 5.0}

video_server_node:
  index_page: index.html
  host_ip: 0.0.0.0  # 服务绑定的IP地址（localhost 或 "0.0.0.0"）
  port: 8100  # 服务绑定的端口
  template_folder: ../utils_local/templates  # 模板文件路径（存放 html 文件的地方）
  output_size: [800, 470]  # 在flask中显示的图像缩放尺寸