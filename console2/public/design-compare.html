<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design QA Comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #05070b; color: #dfe8f7; font: 14px system-ui, sans-serif; }

      img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #080b12; border: 1px solid #233047; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>视觉参考</figcaption><img src="/assets/reference-smart-city-platform.png" alt="视觉参考" /></figure>
      <figure><figcaption>console2 原型（检测器主视图）</figcaption><img src="/assets/prototype-v3-detector.jpg" alt="console2 检测器主视图" /></figure>
    </main>
  </body>
