# ADR-019 local target stack. This file intentionally contains no
# InfluxDB/Telegraf/Grafana services. Production image pins, capacity,
# retention, HA and secrets remain subject to DBA/operations approval.
services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.2}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,HOST://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:${ROAD9_KAFKA_PORT:-19093}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "${ROAD9_KAFKA_PORT:-19093}:9093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [uav_target]

  road9:
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb:latest-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: road9
      POSTGRES_USER: ${ROAD9_USER:-traffic}
      POSTGRES_PASSWORD: ${ROAD9_PASSWORD:-traffic123}
    ports:
      - "${ROAD9_PORT:-6544}:5432"
    volumes:
      - road9_target_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROAD9_USER:-traffic} -d road9"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [uav_target]

  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 512m
    environment:
      DEBUG: "false"
      SERVICE_PORT: 8000
      DB_HOST: road9
      DB_PORT: 5432
      DB_USER: ${ROAD9_USER:-traffic}
      DB_PASSWORD: ${ROAD9_PASSWORD:-traffic123}
      DB_NAME: road9
      DB_BOOTSTRAP_DATABASE: postgres
      DB_LEGACY_NAME: road9
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_CONSUMER_GROUP: uav-platform-target
      KAFKA_TOPICS_PATTERN: "((uav_)?(statistics|track_complete|conflicts|telemetry)_.*|(uav_)?system_metrics)"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-road9-target-change-before-production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      PIPELINE_PROJECT_ROOT: /project
      PIPELINE_FRAME_STRIDE: "10"
      HLS_OUTPUT_DIR: /hls
      CALIBRATION_DB_PATH: /calibration/calibration_db.json
      SURVEY_STORAGE_DIR: /survey
      SURVEY_ASSET_ROOTS: '["/project/test_videos"]'
      UAV_LOCAL_ASSET_ROOTS: '["/project/test_videos"]'
    ports:
      - "${ROAD9_PLATFORM_PORT:-18005}:8000"
    volumes:
      - hls_target_data:/hls
      - calibration_target_data:/calibration
      - survey_target_data:/survey
      - .:/project:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready')); assert data['status'] == 'ready' "]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      road9:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [uav_target]

  console2:
    build:
      context: ./console2
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ROAD9_CONSOLE_PORT:-4177}:8080"
    depends_on:
      platform:
        condition: service_healthy
    networks: [uav_target]

networks:
  uav_target:
    driver: bridge

volumes:
  road9_target_data:
  hls_target_data:
  calibration_target_data:
  survey_target_data:
