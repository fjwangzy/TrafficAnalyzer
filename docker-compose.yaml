# Production release topology. macOS development runs Platform natively.
# ADR-019 canonical data services remain road9 + Kafka KRaft.
# Historical storage is intentionally not mounted or migrated into this stack.
# The road9 volume must start clean.
services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.2}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,HOST://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [uav_target]

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-provectuslabs/kafka-ui:latest}
    restart: unless-stopped
    profiles: ["ops"]
    ports:
      - "${KAFKA_UI_PORT:-9001}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-uav
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [uav_target]

  road9:
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb:latest-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: road9
      POSTGRES_USER: ${ROAD9_USER:-traffic}
      POSTGRES_PASSWORD: ${ROAD9_PASSWORD:?ROAD9_PASSWORD is required for production}
    ports:
      - "${ROAD9_PORT:-5432}:5432"
    volumes:
      - road9_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROAD9_USER:-traffic} -d road9"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [uav_target]

  platform:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: 512m
    environment:
      DEBUG: "false"
      DEPLOYMENT_MODE: "production"
      SERVICE_PORT: 8000
      DB_HOST: road9
      DB_PORT: 5432
      DB_USER: ${ROAD9_USER:-traffic}
      DB_PASSWORD: ${ROAD9_PASSWORD:?ROAD9_PASSWORD is required for production}
      DB_NAME: road9
      DB_BOOTSTRAP_DATABASE: postgres
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_SPOOL_DIR: /pipeline-spool
      KAFKA_CONSUMER_GROUP: uav-platform
      KAFKA_TOPICS_PATTERN: "uav_(statistics|track_complete|conflicts|telemetry)_.*|uav_system_metrics"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required for production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required for production}
      MEDIA_COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS JSON list is required for production}
      PIPELINE_PROJECT_ROOT: /app
      PIPELINE_FRAME_STRIDE: "${PIPELINE_FRAME_STRIDE:-10}"
      PIPELINE_DEVICE: "${PIPELINE_DEVICE:-cpu}"
      PIPELINE_IMGSZ: "${PIPELINE_IMGSZ:-960}"
      HLS_OUTPUT_DIR: /hls
      GEOJSON_OUTPUT_DIR: /pipeline-output
      CALIBRATION_DB_PATH: /calibration/calibration_db.json
      LANE_ANNOTATION_AUTO_TASKS_ENABLED: "false"
      SURVEY_STORAGE_DIR: /survey
      SURVEY_ASSET_ROOTS: '["/app/test_videos"]'
      UAV_LOCAL_ASSET_ROOTS: '["/app/test_videos"]'
    ports:
      - "${PLATFORM_PORT:-8000}:8000"
    volumes:
      - hls_data:/hls
      - pipeline_output_data:/pipeline-output
      - pipeline_spool_data:/pipeline-spool
      - calibration_data:/calibration
      - survey_data:/survey
      - ./weights:/app/weights:ro
      - ./test_videos:/app/test_videos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready')); assert data['status'] == 'ready'"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      road9:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [uav_target]

  console2:
    build:
      context: ./console2
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-8080}:8080"
    depends_on:
      platform:
        condition: service_healthy
    networks: [uav_target]

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8009}:8009"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - hls_data:/hls:ro
    depends_on:
      platform:
        condition: service_healthy
    networks: [uav_target]

  nvidia-mps:
    image: ${NVIDIA_MPS_IMAGE:-nvidia/cuda:12.4.0-base-ubuntu22.04}
    restart: unless-stopped
    profiles: ["gpu-only"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /tmp/nvidia-mps /var/log/nvidia-mps
        nvidia-cuda-mps-control -d
        tail -f /var/log/nvidia-mps/control.log
    volumes:
      - nvidia_mps_pipes:/tmp/nvidia-mps
      - nvidia_mps_logs:/var/log/nvidia-mps
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [uav_target]

networks:
  uav_target:
    driver: bridge

volumes:
  road9_data:
    name: ${ROAD9_VOLUME_NAME:-traffic_road9_data}
  kafka_data:
    name: ${KAFKA_VOLUME_NAME:-traffic_kafka_data}
  hls_data:
    name: ${HLS_VOLUME_NAME:-traffic_hls_data}
  pipeline_output_data:
    name: ${PIPELINE_OUTPUT_VOLUME_NAME:-traffic_pipeline_output_data}
  pipeline_spool_data:
    name: ${PIPELINE_SPOOL_VOLUME_NAME:-traffic_pipeline_spool_data}
  calibration_data:
    name: ${CALIBRATION_VOLUME_NAME:-traffic_calibration_data}
  survey_data:
    name: ${SURVEY_VOLUME_NAME:-traffic_survey_data}
  nvidia_mps_pipes:
  nvidia_mps_logs:
