<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>GIS 态势 — 移动端</title><link rel="stylesheet" href="styles.css" />
<style>
  body { max-width:430px; margin:0 auto; min-height:100vh; }
  .mobile-app { display:flex; flex-direction:column; min-height:100vh; }
  .mobile-header { padding:var(--sp-3) var(--sp-4); background:var(--bg-deep); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:var(--sp-3); }
  .mobile-map { flex:1; position:relative; overflow:hidden; background:var(--bg-deep); }
  .map-bottom-sheet { background:var(--bg-deep); border-top:1px solid var(--border); border-radius:var(--r-xl) var(--r-xl) 0 0; padding:var(--sp-4) var(--sp-4) 0; margin-top:-12px; position:relative; z-index:2; }
  .sheet-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto var(--sp-3); }
  .int-row { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) 0; border-bottom:1px solid var(--border); }
  .int-row:last-child { border:0; }
  .mobile-nav { display:flex; justify-content:space-around; padding:var(--sp-3); background:var(--bg-deep); border-top:1px solid var(--border); }
  .nav-tab { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:var(--fg-dim); cursor:pointer; }
  .nav-tab.active-tab { color:var(--accent); }
</style>
</head>
<body>
<div class="mobile-app">
  <div class="mobile-header">
    <span style="font-size:18px;">⊞</span>
    <span style="font-weight:600;font-size:15px;">GIS 态势</span>
    <span class="mono dim" style="font-size:11px;margin-left:auto;">24 路口 · 18 无人机</span>
  </div>
  <div class="mobile-map">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 40% 40%,oklch(24% 0.03 210 / 0.4),transparent 60%),var(--bg-deep);"></div>
    <div style="position:absolute;inset:0;background-image:linear-gradient(oklch(40% 0.01 250 / 0.05) 1px,transparent 1px),linear-gradient(90deg,oklch(40% 0.01 250 / 0.05) 1px,transparent 1px);background-size:40px 40px;"></div>
    <!-- Roads -->
    <div style="position:absolute;top:30%;left:5%;right:5%;height:3px;background:oklch(38% 0.015 250 / 0.4);"></div>
    <div style="position:absolute;top:60%;left:10%;right:10%;height:2px;background:oklch(35% 0.01 250 / 0.3);"></div>
    <div style="position:absolute;left:30%;top:10%;bottom:10%;width:3px;background:oklch(38% 0.015 250 / 0.4);"></div>
    <div style="position:absolute;left:65%;top:15%;bottom:15%;width:2px;background:oklch(35% 0.01 250 / 0.3);"></div>
    <!-- Markers -->
    <div class="map-marker smooth" style="top:30%;left:30%;"></div>
    <div class="map-marker congested" style="top:30%;left:65%;"><div class="marker-pulse"></div></div>
    <div class="map-marker slow" style="top:60%;left:30%;"></div>
    <div class="map-marker smooth" style="top:60%;left:65%;"></div>
    <div class="map-marker drone" style="top:28%;left:32%;"></div>
    <div class="map-marker drone" style="top:58%;left:63%;"></div>
    <!-- Popup -->
    <div style="position:absolute;top:22%;left:60%;background:oklch(18% 0.015 250 / 0.95);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);font-size:11px;min-width:140px;">
      <div style="font-weight:600;font-size:12px;">人民大道/建设路</div>
      <div class="mono" style="color:var(--danger);margin-top:2px;">拥堵 2.31</div>
      <div class="dim" style="font-size:10px;">1,247 veh/h</div>
    </div>
    <!-- Legend -->
    <div style="position:absolute;bottom:var(--sp-3);left:var(--sp-3);display:flex;gap:var(--sp-3);font-size:10px;font-family:var(--font-mono);color:var(--fg-muted);background:oklch(15% 0.02 250 / 0.85);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-sm);border:1px solid var(--border);">
      <span style="display:flex;align-items:center;gap:3px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--success);"></span>畅通</span>
      <span style="display:flex;align-items:center;gap:3px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--warn);"></span>缓行</span>
      <span style="display:flex;align-items:center;gap:3px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--danger);"></span>拥堵</span>
    </div>
  </div>
  <div class="map-bottom-sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-2);">
      <span style="font-size:13px;font-weight:600;">路口状态</span>
      <span class="mono dim" style="font-size:10px;">按拥堵排序</span>
    </div>
    <div class="int-row">
      <span class="int-status" style="width:10px;height:10px;border-radius:50%;background:var(--danger);box-shadow:0 0 6px var(--danger);flex-shrink:0;"></span>
      <div style="flex:1;"><div style="font-size:13px;font-weight:500;">人民大道/建设路</div><div class="mono dim" style="font-size:10px;">拥堵 2.31 · 1,247 veh/h</div></div>
      <span class="badge badge-danger">P1</span>
    </div>
    <div class="int-row">
      <span class="int-status" style="width:10px;height:10px;border-radius:50%;background:var(--warn);flex-shrink:0;"></span>
      <div style="flex:1;"><div style="font-size:13px;font-weight:500;">中山路/解放路</div><div class="mono dim" style="font-size:10px;">缓行 1.47 · 847 veh/h</div></div>
    </div>
    <div class="int-row">
      <span class="int-status" style="width:10px;height:10px;border-radius:50%;background:var(--success);flex-shrink:0;"></span>
      <div style="flex:1;"><div style="font-size:13px;font-weight:500;">文化路/科技大道</div><div class="mono dim" style="font-size:10px;">畅通 0.82 · 612 veh/h</div></div>
    </div>
  </div>
  <div class="mobile-nav">
    <div class="nav-tab"><span class="nav-tab-icon" style="font-size:18px;">⚡</span>告警</div>
    <div class="nav-tab active-tab"><span class="nav-tab-icon" style="font-size:18px;">⊞</span>GIS</div>
    <div class="nav-tab"><span class="nav-tab-icon" style="font-size:18px;">◎</span>监测</div>
    <div class="nav-tab"><span class="nav-tab-icon" style="font-size:18px;">☰</span>报告</div>
  </div>
</div>
  <script src="app.js"></script>
  <button class="theme-toggle" style="position:fixed;top:12px;right:12px;z-index:100;"><span class="theme-icon">⚡</span><span class="theme-label">CTO 模式</span></button>
</body>
</html>
