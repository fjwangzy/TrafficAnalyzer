version: '3.9'

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    image: postgres:16-alpine
    container_name: traffic-postgres
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic123
      POSTGRES_DB: traffic_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traffic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:1.8
    container_name: traffic-influxdb
    environment:
      INFLUXDB_DB: traffic
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - traffic-net
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: traffic-kafka
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - traffic-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Platform Backend (Monolith)
  # ============================================

  platform:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: traffic-platform
    environment:
      # Application
      DEBUG: "false"
      SERVICE_PORT: 8000

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: traffic
      DB_PASSWORD: traffic123
      DB_NAME: traffic_platform

      # Kafka
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_CONSUMER_GROUP: vision-service
      KAFKA_TOPICS_PATTERN: "((statistics|track_complete|conflicts|telemetry)_.*|system_metrics)"

      # InfluxDB
      INFLUX_HOST: influxdb
      INFLUX_PORT: 8086
      INFLUX_DB: traffic
      INFLUX_USER: ""
      INFLUX_PASS: ""

      # JWT
      JWT_SECRET_KEY: "your-secret-key-change-in-production"
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # Alert Rules
      QUEUE_OVERFLOW_THRESHOLD_M: 80.0
      CONGESTION_SEVERE_THRESHOLD: 4.0
      CALIBRATION_DRIFT_MATCH_RATE: 0.80
      CONSECUTIVE_CONGESTION_FRAMES: 30

      # Video
      HLS_OUTPUT_DIR: /hls
      PIPELINE_VIDEO_BASE: "http://traffic_analyzer_camera_1:8100/video"

      # Calibration
      CALIBRATION_DB_PATH: /calibration/calibration_db.json
    ports:
      - "8000:8000"
    volumes:
      - hls_data:/hls
      - ../../configs:/calibration:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - traffic-net
    restart: unless-stopped

  # ============================================
  # Frontend
  # ============================================

  frontend:
    build:
      context: ../../traffic-fly-console
      dockerfile: Dockerfile
    container_name: traffic-frontend
    environment:
      VITE_API_BASE: "http://localhost:8000/api/v1"
    ports:
      - "8080:8080"
    depends_on:
      - platform
    networks:
      - traffic-net
    restart: unless-stopped

volumes:
  postgres_data:
  influxdb_data:
  kafka_data:
  hls_data:

networks:
  traffic-net:
    driver: bridge
