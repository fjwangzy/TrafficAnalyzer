[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traffic-platform"
version = "1.0.0"
description = "Traffic Platform — unified monolith application"
requires-python = ">=3.11"
dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.0.0",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",

    # ── Authentication ──
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",

    # ── Kafka ──
    "aiokafka>=0.11.0",

    # ── InfluxDB ──
    "influxdb>=5.3.2",

    # ── WebSockets ──
    "websockets>=12.0",

    # ── Utilities ──
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
