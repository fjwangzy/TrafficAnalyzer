[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traffic-flight"
version = "0.1.0"
description = "Traffic Platform - Flight Service (Drone Management)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
