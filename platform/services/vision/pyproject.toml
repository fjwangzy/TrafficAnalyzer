[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traffic-vision"
version = "0.1.0"
description = "Traffic Platform - Vision Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "aiokafka>=0.11.0",
    "httpx>=0.27.0",
    "influxdb>=5.3.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
