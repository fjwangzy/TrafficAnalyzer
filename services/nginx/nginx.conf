events {}

http {
    client_max_body_size 8g;

    server {
        listen 8009;

        # Docker DNS resolver for dynamic upstream
        resolver 127.0.0.11 valid=10s ipv6=off;

        # ── Authenticated HLS segments ──
        location /hls/ {
            access_log off;
            set $platform "http://platform:8000";
            proxy_pass $platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Platform API proxy ──
        location /api/ {
            set $platform "http://platform:8000";
            proxy_pass $platform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Platform WebSocket proxy ──
        location /ws/ {
            access_log off;
            set $platform "http://platform:8000";
            proxy_pass $platform;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # ── Platform root (health/ready) ──
        location = /health {
            set $platform "http://platform:8000";
            proxy_pass $platform;
        }
        location = /ready {
            set $platform "http://platform:8000";
            proxy_pass $platform;
        }

        # ── Authenticated camera MJPEG proxy ──
        location ~ ^/camera_(\d+)$ {
            access_log off;
            rewrite ^/camera_(\d+)$ /api/v1/video/camera/$1 break;
            proxy_pass http://platform:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }
    }
}
