events {}

http {
    client_max_body_size 50m;

    server {
        listen 8009;

        # Docker DNS resolver for dynamic upstream
        resolver 127.0.0.11 valid=10s ipv6=off;

        # ── HLS segments (served from shared volume) ──
        location /hls/ {
            alias /hls/;
            add_header Cache-Control "public, max-age=0";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type";
            if ($request_method = OPTIONS) { return 204; }
        }

        # ── Platform API proxy ──
        location /api/ {
            set $platform "http://traffic_platform:8000";
            proxy_pass $platform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Platform WebSocket proxy ──
        location /ws/ {
            set $platform "http://traffic_platform:8000";
            proxy_pass $platform;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── Platform root (health/ready) ──
        location = /health {
            set $platform "http://traffic_platform:8000";
            proxy_pass $platform;
        }
        location = /ready {
            set $platform "http://traffic_platform:8000";
            proxy_pass $platform;
        }

        # ── Camera MJPEG proxy (streaming-optimized) ──
        # 支持Docker容器和本地管道的动态路由
        location ~ ^/camera_(\d+)$ {
            # 尝试Docker容器，失败后回退到localhost
            set $camera_port "";
            if ($1 = "1") { set $camera_port "8100"; }
            if ($1 = "2") { set $camera_port "8100"; }
            if ($1 = "3") { set $camera_port "8100"; }
            if ($1 = "10") { set $camera_port "8103"; }

            resolver 127.0.0.11 valid=10s ipv6=off;

            # 首先尝试Docker内部容器
            set $docker_upstream "http://traffic_analyzer_camera_$1:8100/video";
            set $local_upstream "http://host.docker.internal:$camera_port/video";

            proxy_pass $docker_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }
    }
}
